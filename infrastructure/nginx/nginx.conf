# Reverse proxy fronting the whole stack (§38).
#
# One origin for the browser: the SPA at /, the API at /api. That matters beyond CORS — signed
# asset URLs the API mints are absolute against PUBLIC_BASE_URL, and a single origin keeps the
# viewer's WebGL texture loads on the same host as the page that requested them.

# Rate limiting for the sign-in routes, as a second layer in front of the application's own.
#
# The API limits per address too, and more intelligently — it knows which account was named and
# can tell a failure from a success. What it cannot do is decline before a worker is occupied:
# by the time Python is deciding, a connection, a request body and a worker slot have already
# been spent. This sheds that load at the edge, which is the half that matters when the goal is
# exhausting the server rather than guessing a password.
#
# Keyed on $binary_remote_addr — the connection's real source, not a header — so nothing a
# caller sends can move them to a different bucket.
#
# 10m holds roughly 160,000 addresses. 30r/m is well above a person signing in and far below
# anything useful for hammering bcrypt; `burst=10 nodelay` lets an office arriving together pass
# straight through rather than being queued behind each other.
limit_req_zone $binary_remote_addr zone=sitescope_auth:10m rate=30r/m;

# 429 rather than nginx's default 503: the API says the same thing for the same reason, and a
# client should not have to tell two kinds of "slow down" apart depending on which layer answered.
limit_req_status 429;

upstream sitescope_api {
    server api:8000;
}

upstream sitescope_frontend {
    server frontend:80;
}

# 360 videos are large; the cap here must not be lower than MAX_UPLOAD_BYTES or nginx rejects
# uploads before the API's own (better-worded) validation can.
client_max_body_size 2g;

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version.
    server_tokens off;

    # Security headers. The CSP allows blob: and data: images because the 360 viewer builds
    # textures from fetched image data, and 'unsafe-inline' styles because Tailwind's runtime
    # injects a style element.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- WebSocket ----------------------------------------------------------
    # Must come before /api/, and must be its own block: the API location below sets
    # `Connection ""` to keep connections alive to the upstream, which is exactly the header a
    # WebSocket upgrade needs to carry instead. Without this the socket fails behind the proxy
    # while working perfectly against the dev server — the whole feature is silently absent in
    # production and the client falls back to polling, so nothing looks broken.
    #
    # nginx matches the longest prefix regardless of order, but it is written first anyway so
    # the relationship between the two blocks is visible.
    location /api/events {
        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle socket is the normal state: nothing is published between captures. The default
        # 60s read timeout would close every connection a minute after it opened, and the client
        # would reconnect for ever on a backoff.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # nginx's own 429 is an HTML error page, while the API answers with the `{code, message}`
    # envelope every client here already understands. Without this a caller has to parse two
    # different shapes depending on which layer happened to refuse it — and the web client would
    # show "Too Many Requests" instead of a sentence telling the operator what to do.
    error_page 429 /__rate_limited;
    location = /__rate_limited {
        internal;
        default_type application/json;
        return 429 '{"code":"rate_limited","message":"Too many sign-in attempts from this network. Wait a moment and try again."}';
    }

    # ---- Sign-in ------------------------------------------------------------
    # Its own location so the limit applies to the two unauthenticated routes and nothing else.
    # Rate-limiting /api/ as a whole would throttle uploads and frame fetches, which are supposed
    # to be numerous.
    location ~ ^/api/auth/(login|refresh)$ {
        limit_req zone=sitescope_auth burst=10 nodelay;

        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Frame extraction from a long 360 video can take minutes. The request itself returns
        # immediately (processing is queued), but an upload of a 2 GiB file legitimately takes a
        # while and must not be cut off mid-stream.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # OpenAPI docs, served by the API.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://sitescope_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://sitescope_api/health;
        access_log off;
    }

    # ---- SPA ----------------------------------------------------------------
    location / {
        proxy_pass http://sitescope_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
