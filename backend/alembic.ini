[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The URL is supplied at runtime from DATABASE_URL by alembic/env.py, so no credential is
# ever written into this file.
sqlalchemy.url =

# No post-write hooks: ruff ships as a compiled binary rather than a console_scripts
# entry point, so alembic cannot invoke it this way. Run `ruff format alembic/` manually.
[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
