name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite runs against SQLite by default so it needs no services, but a Postgres run also
    # happens below — a schema that only works on SQLite is not a schema that ships.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Ruff (lint)
        run: uv run ruff check app tests

      - name: Ruff (format check)
        run: uv run ruff format --check app tests

      - name: mypy
        run: uv run mypy app

      - name: Tests
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/.coverage
          if-no-files-found: ignore

  migrations:
    name: Migrations — PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: sitescope
          POSTGRES_USER: sitescope
          POSTGRES_PASSWORD: sitescope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sitescope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://sitescope:sitescope@localhost:5432/sitescope

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e ".[dev]"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: The schema actually persisted
        # `alembic upgrade` reporting success is not the same as the tables existing. A helper in
        # env.py that opens a transaction before Alembic does takes ownership of it, and a
        # connection closed without a commit is rolled back -- so all three migrations log
        # success and the database comes out empty. That happened, and it surfaced two steps
        # later as "Target database is not up to date", which names neither the cause nor the
        # step that caused it.
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, inspect

          from app.core.config import settings

          present = set(inspect(create_engine(settings.database_url)).get_table_names())
          expected = {"alembic_version", "users", "projects", "capture_locations", "capture_frames"}
          missing = expected - present
          assert not missing, f"upgrade reported success but these tables are absent: {missing}"
          print(f"{len(present)} tables present, including {sorted(expected)}")
          PY

      - name: Migrations match the models
        # Autogenerate must produce an empty migration. If it does not, a model changed without a
        # migration and the next deploy would run against a stale schema.
        run: |
          uv run alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE '^\s+op\.(create|drop|alter|add)' alembic/versions/drift_check_*.py; then
            echo "::error::Models have drifted from the migrations. Run: alembic revision --autogenerate"
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm alembic/versions/drift_check_*.py
          echo "Schema matches the models."

      - name: PostGIS spatial queries behave as the code assumes
        # The rest of the suite runs on SQLite, so this is the only place the PostGIS branch of
        # app/services/spatial.py and the migration's generated-column expression are executed
        # at all. Without this step they are asserted, not tested.
        env:
          POSTGIS_TEST_URL: postgresql+psycopg://sitescope:sitescope@localhost:5432/sitescope
        run: |
          set -euo pipefail
          uv run pytest tests/integration/test_postgis_spatial.py -q -rs | tee spatial.log
          # These tests skip themselves when no PostGIS is reachable, which is right locally and
          # worthless here: a green step that ran nothing is the failure mode this guards.
          if grep -q 'skipped' spatial.log; then
            echo "::error::The PostGIS tests skipped instead of running — they proved nothing."
            exit 1
          fi

      - name: Downgrade cleanly
        run: uv run alembic downgrade base

  contracts:
    name: Shared contracts are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend
        working-directory: backend
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -e .

      - name: Check generated contracts
        # `shared/contracts.ts` is generated from the backend enums. A stale copy means the UI
        # could be rendering against status values the API no longer emits.
        run: backend/.venv/bin/python infrastructure/scripts/export_contracts.py --check

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  mobile:
    name: Mobile — types and camera protocol tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    # The mobile app had no CI at all until the camera client landed. That was the same blind spot
    # that let a YAML syntax error and an impossible healthcheck reach main: code nothing runs is
    # code nobody has checked. These tests need no emulator -- the OSC client takes its transport
    # as a dependency, so the protocol runs under plain Node.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: sitescope-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          # Root context: the frontend imports the generated contracts from shared/.
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: sitescope-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose file
        env:
          JWT_SECRET: ci-only-not-a-real-secret-0000000000
          STORAGE_SIGNING_SECRET: ci-only-not-a-real-secret-1111111
        run: docker compose config --quiet

  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest
    needs: [docker]

    # Job-level, not per-step: every `docker compose` invocation re-interpolates the compose file,
    # so a step without these in scope fails before it runs. That is not hypothetical - it cost a
    # run's worker logs, because "Dump logs on failure" died on the missing variable instead of
    # dumping the logs that would have explained the failure.
    env:
      JWT_SECRET: ci-only-not-a-real-secret-0000000000
      STORAGE_SIGNING_SECRET: ci-only-not-a-real-secret-1111111
      POSTGRES_PASSWORD: ci-postgres

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Every service reports healthy
        # Named explicitly so a future unhealthy service is identified by name in the log rather
        # than as a bare non-zero exit from `--wait`.
        run: docker compose ps --format '{{.Service}} {{.Health}} {{.Status}}'

      - name: The API is healthy behind nginx
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/api/system/health | tee /dev/stderr | grep -q '"status": *"ok"'

      - name: The SPA is served
        run: curl --fail --silent --show-error http://localhost:8080/ | grep -qi 'SiteScope'

      - name: Seed and sign in end to end
        run: |
          set -euo pipefail
          docker compose exec -T api python -m app.seed --demo --quick
          TOKEN=$(curl --fail --silent http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo.example.com","password":"SiteScope360!demo"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          # A processed capture must be visible through the API, not merely present in the database.
          curl --fail --silent http://localhost:8080/api/dashboard \
            -H "Authorization: Bearer $TOKEN" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["total_projects"] >= 1, body
          assert body["total_frames"] >= 1, "the seeded capture produced no frames"
          print("dashboard ok:", body["total_projects"], "projects,", body["total_frames"], "frames")'

      - name: The worker is a live RQ worker, not just a running process
        # The previous version grepped its logs for the word "worker", which the startup banner
        # satisfies even if Redis was never reached. This asks the worker's own healthcheck.
        run: |
          set -euo pipefail
          docker compose exec -T worker python -m app.workers.healthcheck

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes
