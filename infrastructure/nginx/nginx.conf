# Reverse proxy fronting the whole stack (§38).
#
# One origin for the browser: the SPA at /, the API at /api. That matters beyond CORS — signed
# asset URLs the API mints are absolute against PUBLIC_BASE_URL, and a single origin keeps the
# viewer's WebGL texture loads on the same host as the page that requested them.

# Rate limiting for the sign-in routes, as a second layer in front of the application's own.
#
# The API limits per address too, and more intelligently — it knows which account was named and
# can tell a failure from a success. What it cannot do is decline before a worker is occupied:
# by the time Python is deciding, a connection, a request body and a worker slot have already
# been spent. This sheds that load at the edge, which is the half that matters when the goal is
# exhausting the server rather than guessing a password.
#
# Keyed on $binary_remote_addr — the connection's real source, not a header — so nothing a
# caller sends can move them to a different bucket.
#
# 10m holds roughly 160,000 addresses. 30r/m is well above a person signing in and far below
# anything useful for hammering bcrypt; `burst=10 nodelay` lets an office arriving together pass
# straight through rather than being queued behind each other.
limit_req_zone $binary_remote_addr zone=sitescope_auth:10m rate=30r/m;

# 429 rather than nginx's default 503: the API says the same thing for the same reason, and a
# client should not have to tell two kinds of "slow down" apart depending on which layer answered.
limit_req_status 429;

upstream sitescope_api {
    server api:8000;
}

upstream sitescope_frontend {
    server frontend:80;
}

# Small by default, raised only where a large body is the point.
#
# This used to be 2g here, at http level, which applied it to every endpoint rather than the
# three that upload files. The route that made it matter is /api/auth/login: it needs no
# credentials, and the API parses a request body to build the endpoint's arguments before the
# handler — and therefore before the sign-in rate limiter — runs. 1m is far above any JSON this
# API accepts and far below what it costs to parse as JSON into memory.
#
# The API enforces the same split itself (app/api/body_limit.py), so a deployment that does not
# run this gateway is not left with no ceiling at all.
client_max_body_size 1m;

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version.
    server_tokens off;

    # Security headers are set per location, by whichever side generates the response: here for
    # the SPA and the error page below, and in the application (app/api/security_headers.py) for
    # everything it serves.
    #
    # They used to be set once here, at server level, which is tidier and was wrong in both
    # directions. A deployment that does not run this gateway — a cloud load balancer, an
    # ingress, plain uvicorn — got no headers at all. And `script-src 'self'` is right for the
    # SPA and wrong for /docs: FastAPI's Swagger page loads its viewer from a CDN, so the
    # production stack served a blank documentation page.
    #
    # Setting them here *as well* is not the fix. Two Content-Security-Policy headers are both
    # enforced and the browser applies the intersection, so a second policy at this layer would
    # re-break that page whatever the application sent. One owner per response.
    #
    # HSTS is deliberately absent: this server listens on plain HTTP behind whatever terminates
    # TLS, which is where it belongs. The application can send it too — HSTS_MAX_AGE_SECONDS,
    # off by default.
    #
    # One response is left bare by this split and it is a deliberate trade: nginx's own 502/504
    # page, when the API is unreachable, is generated in a proxied location that sets no headers.
    # Covering it would mean repeating `nosniff` on every API response alongside the
    # application's — `add_header` appends rather than replaces, so each one would go out twice
    # — to protect a fixed error page that contains nothing a caller supplied.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- WebSocket ----------------------------------------------------------
    # Must come before /api/, and must be its own block: the API location below sets
    # `Connection ""` to keep connections alive to the upstream, which is exactly the header a
    # WebSocket upgrade needs to carry instead. Without this the socket fails behind the proxy
    # while working perfectly against the dev server — the whole feature is silently absent in
    # production and the client falls back to polling, so nothing looks broken.
    #
    # nginx matches the longest prefix regardless of order, but it is written first anyway so
    # the relationship between the two blocks is visible.
    location /api/events {
        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle socket is the normal state: nothing is published between captures. The default
        # 60s read timeout would close every connection a minute after it opened, and the client
        # would reconnect for ever on a backoff.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # nginx's own 429 is an HTML error page, while the API answers with the `{code, message}`
    # envelope every client here already understands. Without this a caller has to parse two
    # different shapes depending on which layer happened to refuse it — and the web client would
    # show "Too Many Requests" instead of a sentence telling the operator what to do.
    error_page 429 /__rate_limited;
    location = /__rate_limited {
        internal;
        default_type application/json;

        # nginx writes this body itself, so nothing downstream can add the headers to it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        return 429 '{"code":"rate_limited","message":"Too many sign-in attempts from this network. Wait a moment and try again."}';
    }

    # ---- Sign-in ------------------------------------------------------------
    # Its own location so the limit applies to the two unauthenticated routes and nothing else.
    # Rate-limiting /api/ as a whole would throttle uploads and frame fetches, which are supposed
    # to be numerous.
    location ~ ^/api/auth/(login|refresh)$ {
        limit_req zone=sitescope_auth burst=10 nodelay;

        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- Uploads ------------------------------------------------------------
    # The three routes that legitimately carry more than a form's worth of data, and the only
    # ones that get the large ceiling. Everything else inherits the 1m above.
    #
    # The proxy directives are repeated rather than factored into an include because only
    # nginx.conf itself is mounted into the container; a sibling file would simply not be there,
    # and nginx would fail to start on a config that works perfectly in the repository.

    # Signed PUT: whole direct uploads and the individual parts of a chunked one. Also serves
    # assets by GET, which is harmless under the same block.
    location /api/files/ {
        client_max_body_size 2g;

        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # The proxied upload, which streams the body through the API.
    location ~ ^/api/captures/[^/]+/upload$ {
        client_max_body_size 2g;

        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Floor-plan sheets. The route itself caps these at 64 MiB; 128m leaves nginx out of the way
    # so the API's own, better-worded refusal is what the operator sees.
    location ~ ^/api/floors/[^/]+/floorplan$ {
        client_max_body_size 128m;

        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://sitescope_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Frame extraction from a long 360 video can take minutes. The request itself returns
        # immediately (processing is queued), but an upload of a 2 GiB file legitimately takes a
        # while and must not be cut off mid-stream.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # OpenAPI docs, served by the API.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://sitescope_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://sitescope_api/health;
        access_log off;
    }

    # ---- SPA ----------------------------------------------------------------
    location / {
        # The gateway's own responsibility: these are the pages it serves. The CSP allows blob:
        # and data: images because the 360 viewer builds textures from fetched image data, and
        # 'unsafe-inline' styles because Tailwind's runtime injects a style element.
        #
        # `frame-ancestors 'self'` covers the public share page at /s/{token} along with
        # everything else, which is the answer to "can any site frame the shared viewer": not
        # through this gateway. The API's own routes say `'none'`, since nothing in this product
        # frames a JSON response or a panorama.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

        proxy_pass http://sitescope_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
